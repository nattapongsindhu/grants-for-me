name: Twice-Daily Grant Scraper

on:
  schedule:
    # 06:00 AM LA time = 13:00 UTC (PDT, UTC-7) | 14:00 UTC (PST, UTC-8)
    - cron: "0 13 * * *"
    # 06:00 PM LA time = 01:00 UTC next day (PDT) | 02:00 UTC (PST)
    - cron: "0 1 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # TODO: Update to actions/checkout@v5 (Node.js 22) when released.
        # actions/checkout@v4 runs on Node.js 20 — causes a deprecation warning
        # once GitHub enforces the Node.js 22 requirement. No functional impact yet.
        uses: actions/checkout@v4

      - name: Set up Python
        # TODO: Update to actions/setup-python@v6 (Node.js 22) when released.
        # actions/setup-python@v5 runs on Node.js 20 — same deprecation warning as above.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Validate grants.json schema
        run: |
          python - <<'EOF'
          import json, sys
          with open("public/data/grants.json") as f:
              data = json.load(f)
          assert "grants" in data, "Missing 'grants' key"
          assert isinstance(data["grants"], list), "'grants' must be a list"
          for g in data["grants"]:
              for field in ["id", "name", "categories", "eligibility", "coverage", "action"]:
                  assert field in g, f"Grant {g.get('id','?')} missing field: {field}"
          print(f"Schema OK — {len(data['grants'])} grants validated")
          EOF

      - name: Commit updated grants.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/grants.json
          git diff --staged --quiet || git commit -m "chore: update grants.json [$(date -u +%Y-%m-%d)]"
          git push
